    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Meta Tags -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskflow.shanaka.dev" />
    <meta property="og:title" content="TaskFlow – Google Tasks Desktop Client & PWA App" />
    <meta property="og:description" content="A beautiful, modern, standalone Google Tasks desktop client with instant sync, offline support, dark mode, and keyboard shortcuts." />
    <meta property="og:image" content="https://taskflow.shanaka.dev/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://taskflow.shanaka.dev" />
    <meta name="twitter:title" content="TaskFlow – Google Tasks Desktop Client & PWA App" />
    <meta name="twitter:description" content="A beautiful, modern, standalone Google Tasks desktop client with instant sync, offline support, dark mode, and keyboard shortcuts." />
    <meta name="twitter:image" content="https://taskflow.shanaka.dev/og-image.png" />

    <!-- PWA Requirements -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>
      <h1>TaskFlow Desktop – Google Tasks Client & PWA App</h1>
      <p>TaskFlow is a beautiful, modern Google Tasks desktop client. Sync tasks instantly, use standalone window, work offline, and manage your tasks efficiently across Windows, macOS, and Linux.</p>
      <p>JavaScript is required to run this application.</p>
      <ul>
        <li><a href="/pricing">Pricing & Donations</a></li>
        <li><a href="/privacy">Privacy Policy</a></li>
        <li><a href="/terms">Terms of Service</a></li>
      </ul>
    </noscript>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => console.log('SW registered:', registration.scope))
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
